name: "Bluewhale CodeQL Configuration (TypeScript & Go)"

disable-default-queries: false

queries:
  - uses: security-and-quality

paths:
  - packages/core-ts/src
  - packages/bluewhale/src
  - packages/core-go

paths-ignore:
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*_test.go"
