name: fuzz-go

# Seed corpora for FuzzParse / FuzzDetect already run on every PR as part of
# `go test ./...` in ci-go. This job does the actual coverage-guided fuzzing.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Duration per fuzz target (Go duration, e.g. 5m)"
        required: false
        default: "5m"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzParse, FuzzDetect]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/core-go/go.mod
      - name: Run ${{ matrix.target }}
        working-directory: packages/core-go
        run: go test ./address -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime "${{ inputs.fuzztime || '5m' }}"
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: packages/core-go/address/testdata/fuzz/
      - name: Notify Slack / Discord on Failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          PAYLOAD=$(jq -n \
            --arg text "🚨 *Nightly Go Fuzzing Failure* in \`${{ github.repository }}\` (target: \`${{ matrix.target }}\`, ref: \`${{ github.ref_name }}\`) — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>" \
            '{text: $text, content: $text}')
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" || true
          fi
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$DISCORD_WEBHOOK_URL" || true
          fi
