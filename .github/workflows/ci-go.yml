name: ci-go

on:
  pull_request:
    # GitHub rejects `paths` and `paths-ignore` on the same event, so the
    # exclusion is expressed as a negated pattern. Vectors-only PRs are owned
    # by `verify-parity`; PRs that also touch packages/core-go/** run here.
    paths:
      - "packages/core-go/**"
      - "spec/**"
      - "!spec/vectors.json"
      - ".github/workflows/ci-go.yml"

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests
        env:
          GOTOOLCHAIN: auto
        run: cd packages/core-go && go test -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/core-go/go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: packages/core-go

  zero-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/core-go/go.mod
      - name: Fail if go.mod declares external require directives
        working-directory: packages/core-go
        run: |
          if grep -E '^[[:space:]]*require[[:space:]]' go.mod; then
            echo "::error::packages/core-go/go.mod must not declare external dependencies (zero-dependency commitment)."
            exit 1
          fi
      - name: Fail if go list -m all contains modules beyond the module itself
        working-directory: packages/core-go
        run: |
          module=$(go list -m)
          echo "module: ${module}"
          extra=$(go list -m all | tail -n +2)
          if [ -n "${extra}" ]; then
            echo "::error::packages/core-go must have zero external dependencies, but found:"
            echo "${extra}"
            exit 1
          fi
          echo "OK: only ${module} is present."
