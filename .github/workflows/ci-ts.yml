name: ci-ts

on:
  pull_request:
    # GitHub rejects a workflow that sets both `paths` and `paths-ignore` on
    # one event, which kept this workflow from ever running. A `!` pattern
    # gives the same intent: `verify-parity` owns vectors-only PRs, so a PR
    # that changes nothing but spec/vectors.json skips this workflow.
    paths:
      - "packages/core-ts/**"
      - "packages/bluewhale/**"
      - "spec/**"
      - ".github/workflows/ci-ts.yml"
      - "!spec/vectors.json"

permissions:
  contents: read
  # Posting the coverage comment. Fork PRs get a read-only token regardless,
  # so that step is skipped for them and the job summary is the report.
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install
      # Fails the job if coverage drops below the thresholds in
      # packages/core-ts/vitest.config.ts.
      - name: core-ts tests with coverage thresholds
        run: pnpm --filter @redishfish/bluewhale-core test -- --coverage
      - name: Coverage summary
        id: coverage
        if: always()
        run: |
          node packages/core-ts/scripts/coverage-summary.mjs > coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage PR comment
        if: always() && steps.coverage.outcome == 'success' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const body = require("fs").readFileSync("coverage-summary.md", "utf8");
            const marker = "<!-- core-ts-coverage -->";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - run: pnpm --filter @redishfish/bluewhale test
      - name: Upload TypeScript coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: typescript
          files: packages/core-ts/coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
